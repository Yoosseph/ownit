name: Idea or feature request
description: Suggest a change to Ownit, its questions, or its docs.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What's hard or missing today? A real example helps most.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like Ownit to do instead?
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself.
