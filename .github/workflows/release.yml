name: Release

# Push a tag like v0.1.3 (matching cli/package.json) to publish getownit to npm
# and create the GitHub release. npm trusts this workflow through Trusted
# Publishing, so no npm token is stored here (see CONTRIBUTING, "Releasing").
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub release
  id-token: write # npm Trusted Publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches the CLI version
        run: |
          version=$(node -p "require('./cli/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match cli/package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # prepublishOnly builds and tests the CLI again before upload.
      - name: Publish to npm
        working-directory: cli
        run: npm publish --provenance --access public
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "getownit ${GITHUB_REF_NAME#v}" --generate-notes
