name = "ownit"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# The server, not the client, picks the model endpoint and model. A user's key picks the provider:
# "nvapi-" keys go to NVIDIA's API catalog, all others to Nebius. Both serve the same model.
# Model lists: https://tokenfactory.nebius.com/model-catalog.md and https://integrate.api.nvidia.com/v1/models
[vars]
NEBIUS_BASE_URL = "https://api.tokenfactory.nebius.com/v1/"
NEBIUS_MODEL = "nvidia/nemotron-3-super-120b-a12b"
NVIDIA_BASE_URL = "https://integrate.api.nvidia.com/v1/"
NVIDIA_MODEL = "nvidia/nemotron-3-super-120b-a12b"
# "nebius" for real calls, "fixture" for the offline test backend.
MODEL_BACKEND = "nebius"
# Daily cap on model calls paid for by DEMO_NEBIUS_KEY (only used when a request carries no key).
DEMO_DAILY_CALL_CAP = "300"
# Public origin of this worker, used in links printed by the CLI and check runs.
PUBLIC_URL = "https://ownit.ownit-worker.workers.dev"
# Fill these in after creating the GitHub App (docs/github-app.md).
GITHUB_APP_ID = "5413583"
GITHUB_APP_SLUG = "ownit-app"
GITHUB_CLIENT_ID = "Iv23li5nolIz89LR1Dk6"

# Secrets (set with `wrangler secret put <NAME>`; locally from the repo's .env via `npm run dev`):
#   SESSION_SECRET          random string used to seal debrief state between requests
#   GITHUB_APP_PRIVATE_KEY  the App's private key (PEM, PKCS#1 or PKCS#8)
#   GITHUB_WEBHOOK_SECRET   the App's webhook secret
#   DEMO_NEBIUS_KEY         optional shared key for judges, capped by DEMO_DAILY_CALL_CAP

[[d1_databases]]
binding = "DB"
database_name = "ownit"
database_id = "bac3beeb-5190-40a3-acec-e8411ea6dce8"
migrations_dir = "migrations"

[triggers]
crons = ["0 * * * *"]

[observability]
enabled = true
